[package]
name = "clawde-commands"
version.workspace = true
description = "Slash command system implementing /help, /clear, /compact, /model, /config, and many other commands"
edition.workspace = true

[features]
# Pass-through features from cc-core
ultraplan = ["clawde-core/ultraplan"]

[dependencies]
clawde-core = { workspace = true }
clawde-api = { workspace = true }
clawde-tools = { workspace = true }
clawde-query = { workspace = true }
clawde-mcp = { workspace = true }
clawde-tui = { workspace = true }
clawde-plugins = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
arboard = { version = "3", default-features = false }
urlencoding = { workspace = true }
open = { workspace = true }
qrcode = { workspace = true }
clawde-bridge = { workspace = true }
hostname = "0.4"
uuid = { workspace = true }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
base64 = { workspace = true }
tempfile = { workspace = true }
