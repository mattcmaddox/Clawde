[package]
name = "clawde-tui"
version.workspace = true
description = "Ratatui-based terminal user interface with markdown rendering, dialogs, session browser, and theme support"
edition.workspace = true

[features]
# Only names that gate real code belong here; see the rule and the retired
# names in crates/core/Cargo.toml. `scripts/audits/feature-gate-scan.py`
# enforces it in CI.

# Enable real microphone capture for voice PTT mode (capture lives in
# clawde-core; the TUI just drives it).
voice = ["clawde-core/voice"]

# The one gated capability whose cfg sites live in this crate
# (src/app.rs, src/render.rs), so it needs no core passthrough.
token_budget = []

# Cached micro-compaction is gated in clawde-core (context_collapse.rs);
# declared here so a TUI-only `--features` build can reach it.
cached_microcompact = ["clawde-core/cached_microcompact"]

# Full dev build — every gated feature, voice included via clawde-core.dev_full.
dev_full = ["clawde-core/dev_full", "token_budget"]

[dependencies]
clawde-core = { workspace = true }
clawde-api = { workspace = true }
clawde-tools = { workspace = true }
clawde-query = { workspace = true }
clawde-mcp = { workspace = true }
clawde-katban = { workspace = true }
clawde-plugins = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
unicode-width = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
dirs = { workspace = true }
similar = { workspace = true }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
once_cell = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
dashmap = { workspace = true }
icy_sixel = { workspace = true }
image = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
