[package]
name = "clawde-tui"
version.workspace = true
description = "Ratatui-based terminal user interface with markdown rendering, dialogs, session browser, and theme support"
edition.workspace = true

[features]
# Enable real microphone capture for voice PTT mode.
voice = ["clawde-core/voice", "dep:cpal", "dep:hound"]

# UI & Interaction features (pass-through from cc-core)
token_budget = ["clawde-core/token_budget"]
ultraplan = ["clawde-core/ultraplan"]
ultrathink = ["clawde-core/ultrathink"]
history_picker = ["clawde-core/history_picker"]
message_actions = ["clawde-core/message_actions"]
quick_search = ["clawde-core/quick_search"]
away_summary = ["clawde-core/away_summary"]
hook_prompts = ["clawde-core/hook_prompts"]
kairos_brief = ["clawde-core/kairos_brief"]
kairos_channels = ["clawde-core/kairos_channels"]
lodestone = ["clawde-core/lodestone"]

# Agents & Memory features (pass-through from cc-core)
agent_triggers = ["clawde-core/agent_triggers"]
agent_triggers_remote = ["clawde-core/agent_triggers_remote"]
extract_memories = ["clawde-core/extract_memories"]
verification_agent = ["clawde-core/verification_agent"]
builtin_explore_plan_agents = ["clawde-core/builtin_explore_plan_agents"]
cached_microcompact = ["clawde-core/cached_microcompact"]
compaction_reminders = ["clawde-core/compaction_reminders"]
agent_memory_snapshot = ["clawde-core/agent_memory_snapshot"]
teammem = ["clawde-core/teammem"]

# Tools & Infrastructure features (pass-through from cc-core)
bash_classifier = ["clawde-core/bash_classifier"]
bridge_mode = ["clawde-core/bridge_mode"]
mcp_rich_output = ["clawde-core/mcp_rich_output"]
connector_text = ["clawde-core/connector_text"]
unattended_retry = ["clawde-core/unattended_retry"]
new_init = ["clawde-core/new_init"]
powershell_auto_mode = ["clawde-core/powershell_auto_mode"]
shot_stats = ["clawde-core/shot_stats"]
tree_sitter_bash = ["clawde-core/tree_sitter_bash"]
tree_sitter_bash_shadow = ["clawde-core/tree_sitter_bash_shadow"]
native_clipboard_image = ["clawde-core/native_clipboard_image"]
prompt_cache_break_detection = ["clawde-core/prompt_cache_break_detection"]
ccr_auto_connect = ["clawde-core/ccr_auto_connect"]
ccr_mirror = ["clawde-core/ccr_mirror"]
ccr_remote_setup = ["clawde-core/ccr_remote_setup"]

[dependencies]
clawde-core = { workspace = true }
clawde-api = { workspace = true }
clawde-tools = { workspace = true }
clawde-query = { workspace = true }
clawde-mcp = { workspace = true }
clawde-katban = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
unicode-width = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
dirs = { workspace = true }
similar = { workspace = true }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
once_cell = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
dashmap = { workspace = true }
icy_sixel = { workspace = true }
image = { workspace = true }
regex = { workspace = true }
# Optional audio capture for voice PTT (gated behind the `voice` feature)
cpal = { version = "0.15", optional = true }
hound = { version = "3.5", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
