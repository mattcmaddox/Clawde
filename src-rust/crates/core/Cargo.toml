[package]
name = "clawde-core"
version.workspace = true
description = "Foundation crate: config, auth, storage, types, permissions, keybindings, effort levels, and utilities"
edition.workspace = true

[features]
# Every name declared here must turn real code on or off: either it owns a
# `cfg(feature = "<name>")` site, or it carries an optional dependency. A name
# with neither compiles to nothing, and because `dev_full` promises "every
# gated feature", each empty declaration makes that promise false. Checked by
# `scripts/audits/feature-gate-scan.py` (CI step "Feature-gate inventory").
#
# Capabilities that used to be listed here but gated no code at all —
# ultraplan, ultrathink, history_picker, quick_search, message_actions,
# hook_prompts, the kairos/lodestone/teammem and agent/memory families, the
# tree-sitter and ccr_* families, and the rest — have been removed. Several of
# those capabilities exist and ship ungated (e.g. `/ultraplan` in
# crates/commands/src/named_commands.rs, `bash_classifier` as a public module),
# so removing the flag did not remove the feature; it made the table describe
# reality. Intended-but-unbuilt work is tracked in docs/plans/ and
# docs/audits/unfinished-feature-plan.md, not as dead flag names.

# Enable real microphone capture via cpal.
# Without this feature the VoiceRecorder compiles but start_recording()
# returns an error instead of accessing hardware.
voice = ["dep:cpal"]

# Cached micro-compaction: the `cached_microcompact` cfg sites live in
# src/context_collapse.rs.
cached_microcompact = []

# Full dev build — every gated feature in this crate.
dev_full = ["voice", "cached_microcompact"]

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
indexmap = { workspace = true }
regex = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
getrandom = { workspace = true }
url = { workspace = true }
schemars = { workspace = true }
reqwest = { workspace = true }
urlencoding = { workspace = true }
glob = { workspace = true }
similar = { workspace = true }
which = { workspace = true }
tokio-util = { workspace = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
rusqlite = { workspace = true }
# Optional: real audio capture for voice input (gated behind the `voice` feature)
cpal = { version = "0.15", optional = true }
# `libc::atexit` removes the per-process test scratch directory when a test
# harness exits, so a `cargo test` run leaves nothing behind.
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
