[package]
name = "clawde-cli"
version.workspace = true
description = "Binary entry point with CLI argument parsing, TUI launch, headless mode, and ACP server mode"
edition.workspace = true

[[bin]]
name = "clawde"
path = "src/main.rs"

[features]
default = ["voice"]
voice = ["clawde-core/voice", "clawde-tui/voice"]

[dependencies]
clawde-core = { workspace = true }
clawde-api = { workspace = true }
clawde-acp = { workspace = true }
clawde-tools = { workspace = true }
clawde-query = { workspace = true }
clawde-tui = { workspace = true }
clawde-commands = { workspace = true }
clawde-mcp = { workspace = true }
clawde-bridge = { workspace = true }
clawde-plugins = { workspace = true }
clawde-gateway = { workspace = true }
clawde-katban = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
tokio-util = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
crossterm = { workspace = true }
parking_lot = { workspace = true }
dirs = { workspace = true }
nix = { workspace = true }
base64 = "0.22"
sha2 = "0.10"
open = "5"
urlencoding = "2"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[build-dependencies]
chrono = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
