# Cross.toml — Docker-based cross-compilation setup for `cross` (used by
# scripts/build.sh for the linux-aarch64 leg and the optional Windows-GNU leg).
# Only read when building with `cross`; plain cargo builds ignore it.

[target.aarch64-unknown-linux-gnu]
pre-build = [
  "dpkg --add-architecture $CROSS_DEB_ARCH",
  "apt-get update",
  "apt-get install -y pkg-config libssl-dev:$CROSS_DEB_ARCH libasound2-dev:$CROSS_DEB_ARCH"
]

[target.x86_64-pc-windows-gnu]
pre-build = [
  "apt-get update",
  "apt-get install -y pkg-config libasound2-dev"
]
