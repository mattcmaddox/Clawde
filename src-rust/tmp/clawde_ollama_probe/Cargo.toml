[package]
name = "clawde_ollama_probe"
# Inherit the workspace version: bump-version.py stamps this crate's
# Cargo.lock entry on release, so the declared version must match the
# workspace version or the lockfile regenerates as stale under --locked.
version.workspace = true
edition = "2021"

[dependencies]
clawde-api = { path = "../../crates/api" }
clawde-core = { path = "../../crates/core" }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json"] }
