name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., v0.1.1). Must already exist as a GitHub Release.'
        required: true
        type: string

permissions:
  contents: read
  # Required by `npm publish --provenance` for build attestation only.
  # Publish auth itself uses the NPM_TOKEN secret: trusted publishing
  # (OIDC) was never configured on the npm side, and every run relying
  # on it failed with ENEEDAUTH.
  id-token: write

# Dispatched by `scripts/build.sh release` (via `gh workflow run`) after the
# GitHub Release exists; can also be run manually from the Actions UI. The
# static concurrency group serializes any accidental double-dispatch — the
# second run no-ops benignly because the version is already on the registry.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    name: Publish clawde to npm

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
          # Writes ~/.npmrc with an ${NODE_AUTH_TOKEN} placeholder that the
          # publish step's env fills in.
          registry-url: 'https://registry.npmjs.org/'

      - name: Set up npm
        run: |
          npm install -g npm@latest
          npm --version

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            VERSION="$(grep '^version' src-rust/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid npm publish version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing clawde@$VERSION"

      - name: Verify GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "${{ steps.version.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null

      - name: Verify repository URL for provenance
        working-directory: npm
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const repo = process.env.GITHUB_REPOSITORY;
          const repositoryUrl = typeof pkg.repository === 'string'
            ? pkg.repository
            : pkg.repository && pkg.repository.url;
          const expectedRepositoryUrl = `git+https://github.com/${repo}.git`;

          console.log('Repository URL npm will bind to the provenance attestation:');
          console.log(`  ${expectedRepositoryUrl}`);

          if (repositoryUrl !== expectedRepositoryUrl) {
            console.error(`::error::npm/package.json repository.url must be ${expectedRepositoryUrl} to match the provenance attestation; found ${repositoryUrl || '(missing)'}`);
            process.exit(1);
          }
          NODE

      - name: Set npm package version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('npm/package.json', 'utf8'));
            pkg.version = '${VERSION}';
            fs.writeFileSync('npm/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Publishing clawde@${VERSION}"

      - name: Publish to npm
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
