name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src-rust/**'
      - 'scripts/probes/tui-permissions-smoke.py'
      - 'scripts/probes/katban-board-ux-probe.py'
      - 'scripts/probes/katban-docker-card-probe.py'
      - 'scripts/probes/catchat-ux-probe.py'
      - 'scripts/audit-env-tests.py'
      - 'scripts/audit-tokio-file-flush.py'
      - 'scripts/audits/feature-gate-scan.py'
      - 'scripts/audits/unwired-code-scan.py'
      - 'scripts/validate-acp-template.py'
      - 'scripts/registry-agent.schema.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src-rust/**'
      - 'scripts/probes/tui-permissions-smoke.py'
      - 'scripts/probes/katban-board-ux-probe.py'
      - 'scripts/probes/katban-docker-card-probe.py'
      - 'scripts/probes/catchat-ux-probe.py'
      - 'scripts/audit-env-tests.py'
      - 'scripts/audit-tokio-file-flush.py'
      - 'scripts/audits/feature-gate-scan.py'
      - 'scripts/audits/unwired-code-scan.py'
      - 'scripts/validate-acp-template.py'
      - 'scripts/registry-agent.schema.json'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Skip CI for version-bump commits from the release workflow
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        # Windows support dropped (issue #2): the platform cannot be
        # reproduced on the Linux dev box and every change cost a
        # push-and-wait CI cycle to surface Windows-only failures.
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    name: Test (${{ matrix.os }})

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # ALSA headers for the voice feature's cpal dependency (same setup as
      # the release build in scripts/build.sh). cmake — required by
      # btls-sys/BoringSSL via wreq — is preinstalled on all GitHub-hosted runners.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config tmux

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-rust/target
          key: ci-${{ matrix.os }}-cargo-${{ hashFiles('src-rust/Cargo.lock') }}
          restore-keys: ci-${{ matrix.os }}-cargo-

      - name: Run tests
        working-directory: src-rust
        # Tests mutate process-global state (env vars like HOME /
        # ANTHROPIC_API_KEY / CLAWDE_HOME), but every such test is serialized
        # behind a crate-level ENV_LOCK guard (canonical one in
        # crates/core/src/paths.rs, audited by scripts/audit-env-tests.py), so
        # the default parallel runner is safe — verified 3x locally at 1.8x the
        # serial speed. Keep audit-env-tests.py green when adding tests.
        run: cargo test --workspace --locked

      # Env-mutation audit: fails if any test-module code mutates process-global
      # state (env vars, working dir) without holding a crate ENV_LOCK guard —
      # the discipline that makes the parallel test run above safe to trust.
      - name: Env-mutation audit
        if: runner.os == 'Linux'
        run: python3 scripts/audit-env-tests.py

      # Async file-write audit: tokio's fs::File returns Ok from `write_all`
      # once the bytes are queued to a blocking task and has no Drop impl, so
      # a write with no following `flush()` is silently fire-and-forget and
      # can lose data (issue #3). The script self-tests its detector against
      # built-in fixtures first, so a rotted detector fails loudly instead of
      # reporting a false all-clear over the tree.
      - name: Async file-flush audit
        if: runner.os == 'Linux'
        run: python3 scripts/audit-tokio-file-flush.py

      # Feature-gate inventory: every feature declared in a workspace Cargo.toml
      # must turn real code on or off (a cfg site or an optional dependency) or
      # delegate to one that does. crates/core had accumulated 30 names that
      # gated nothing, and crates/commands carried a `clawde-core/ultraplan`
      # pass-through for a feature that no longer existed — invisible because
      # nothing here builds a gated configuration. The scan self-tests its
      # classifier first, so a rotted detector fails loudly instead of clearing
      # the tree, and it gates on an invariant rather than a snapshot, so a
      # legitimate new feature never trips it.
      - name: Feature-gate inventory
        if: runner.os == 'Linux'
        run: python3 scripts/audits/feature-gate-scan.py

      # Gated-feature build: the documented `--features dev_full` line from
      # docs/installation.md, compiled for real. Plain `cargo test --workspace`
      # builds no optional feature, so a gated module can rot unnoticed (and a
      # passthrough that cargo would reject stay hidden until someone tries it).
      - name: Gated-feature build (dev_full)
        if: runner.os == 'Linux'
        working-directory: src-rust
        run: cargo check --locked --package clawde-cli --features dev_full

      # Unwired-code inventory: report only, never a gate. `#[allow(dead_code)]`
      # is deliberate reserved surface here (~99 sites) and a name mentioned
      # elsewhere is not proof of wiring, so the list is a set of leads. It is
      # published to the job summary so the audit has a current inventory
      # instead of a hand-counted one. Run with --fail-on-unwired to make it
      # blocking when clearing the list. The script self-tests its counter.
      - name: Unwired-code inventory (report only)
        if: runner.os == 'Linux'
        run: |
          python3 scripts/audits/unwired-code-scan.py --summary \
            | tee /tmp/unwired-code-inventory.txt
          {
            echo '## Unwired-code inventory'
            echo '```'
            cat /tmp/unwired-code-inventory.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ACP registry manifest guard: validates the template against the vendored
      # registry schema and against the legs build.sh actually builds. Without
      # it, the template can re-advertise a macOS/Windows archive no release
      # publishes and only the registry's own CI would catch it, on the PR.
      # jsonschema enables the deep schema tier. The install is best-effort
      # (PEP 668 externally-managed Pythons reject a bare pip install) and the
      # guard always self-tests and runs its stdlib structural + leg tiers, so
      # a skipped install degrades the check rather than failing the step.
      - name: ACP registry template guard
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --quiet jsonschema \
            || echo "jsonschema install skipped; running structural tier only"
          python3 scripts/validate-acp-template.py

      # Dead-code guard: rustc's `dead_code` lint never fires for `pub` items,
      # so every workspace crate carries a `test_no_unreferenced_pub_functions_in_workspace`
      # test (shared logic in clawde-core::dead_code_guard) that fails when a
      # `pub fn` declared in that crate has no caller anywhere in the workspace.
      # Run them as a dedicated fail-fast check so a silently-rotted `pub fn`
      # breaks CI loudly rather than only being caught by a full test run.
      # Linux-only: the guard is platform-independent and the full test job
      # above already runs it on the other OSes.
      - name: Dead-code guard
        if: runner.os == 'Linux'
        working-directory: src-rust
        run: cargo test --workspace --locked test_no_unreferenced_pub_functions_in_workspace

      # Both gates are REQUIRED now: the workspace is clippy-clean with
      # -D warnings and rustfmt-clean, so regressions must fail CI loudly
      # instead of silently accumulating drift.
      - name: Clippy (required)
        if: runner.os == 'Linux'
        working-directory: src-rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: rustfmt (required)
        if: runner.os == 'Linux'
        working-directory: src-rust
        run: cargo fmt --all --check

      - name: Build debug binary for TUI probe
        if: runner.os == 'Linux'
        working-directory: src-rust
        run: cargo build --locked --package clawde-cli

      - name: TUI permission smoke probe
        if: runner.os == 'Linux'
        run: |
          python3 scripts/probes/tui-permissions-smoke.py \
            --binary src-rust/target/debug/clawde \
            --timeout-secs 20

      # Container-tier plumbing (`board runtime docker`). The card phase runs a
      # real free-tier agent, so it stays a dev-machine probe; what CI can prove
      # is the plumbing the lane rests on — instance launch, worktree/binary/home
      # push, exec with a deadline, artifact pull and teardown against a real
      # Docker daemon, plus the tar/restore facts `restore_task_dir` assumes. No
      # keys, no agent, about a minute. The lane was built on Incus and ported to
      # Docker (2026-10-13) for exactly this step: runners ship Docker, not Incus.
      - name: Katban container plumbing probe
        if: runner.os == 'Linux'
        run: |
          python3 scripts/probes/katban-docker-card-probe.py \
            --binary src-rust/target/debug/clawde \
            --plumbing

      # Board UI probe. The board web app is one embedded HTML+JS document with
      # no frontend build step, so nothing above this line compiles or exercises
      # it. playwright + chromium are installed into a throwaway venv rather than
      # the runner's python (PEP 668 externally-managed installs reject a bare
      # `pip install`), and the probe is run with --require-browser so a browser
      # that failed to install fails this step instead of self-skipping green.
      - name: Install chromium for the board UI probe
        if: runner.os == 'Linux'
        run: |
          python3 -m venv /tmp/board-probe-venv
          /tmp/board-probe-venv/bin/pip install --quiet playwright
          /tmp/board-probe-venv/bin/python -m playwright install --with-deps chromium

      - name: Katban board UX probe
        if: runner.os == 'Linux'
        run: |
          /tmp/board-probe-venv/bin/python scripts/probes/katban-board-ux-probe.py \
            --binary src-rust/target/debug/clawde \
            --require-browser

      # Cat Chat guest journey. Same embedded-HTML gap as the board above, and
      # the guest chat is backed by a local mock upstream (see the probe's
      # header) so it needs no free-tier keys and the reply — including the
      # inline reasoning an upstream can leave in its content — is
      # deterministic.
      - name: Cat Chat guest UX probe
        if: runner.os == 'Linux'
        run: |
          /tmp/board-probe-venv/bin/python scripts/probes/catchat-ux-probe.py \
            --binary src-rust/target/debug/clawde \
            --require-browser
