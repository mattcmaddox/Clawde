name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src-rust/**'
      - 'scripts/probes/tui-permissions-smoke.py'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src-rust/**'
      - 'scripts/probes/tui-permissions-smoke.py'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    name: Test (${{ matrix.os }})

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # ALSA headers for the voice feature's cpal dependency (same setup as
      # the release build in scripts/build.sh). cmake — required by
      # btls-sys/BoringSSL via wreq — is preinstalled on all GitHub-hosted runners.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config tmux

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-rust/target
          key: ci-${{ matrix.os }}-cargo-${{ hashFiles('src-rust/Cargo.lock') }}
          restore-keys: ci-${{ matrix.os }}-cargo-

      - name: Run tests
        working-directory: src-rust
        # Tests mutate process-global state (env vars like HOME /
        # ANTHROPIC_API_KEY / CLAWDE_HOME), but every such test is serialized
        # behind a crate-level ENV_LOCK guard (canonical one in
        # crates/core/src/paths.rs, audited by scripts/audit-env-tests.py), so
        # the default parallel runner is safe — verified 3x locally at 1.8x the
        # serial speed. Keep audit-env-tests.py green when adding tests.
        run: cargo test --workspace --locked

      # Env-mutation audit: fails if any test-module code mutates process-global
      # state (env vars, working dir) without holding a crate ENV_LOCK guard —
      # the discipline that makes the parallel test run above safe to trust.
      - name: Env-mutation audit
        if: runner.os == 'Linux'
        run: python3 scripts/audit-env-tests.py

      # Dead-code guard: rustc's `dead_code` lint never fires for `pub` items,
      # so every workspace crate carries a `test_no_unreferenced_pub_functions_in_workspace`
      # test (shared logic in clawde-core::dead_code_guard) that fails when a
      # `pub fn` declared in that crate has no caller anywhere in the workspace.
      # Run them as a dedicated fail-fast check so a silently-rotted `pub fn`
      # breaks CI loudly rather than only being caught by a full test run.
      # Linux-only: the guard is platform-independent and the full test job
      # above already runs it on the other OSes.
      - name: Dead-code guard
        if: runner.os == 'Linux'
        working-directory: src-rust
        run: cargo test --workspace --locked test_no_unreferenced_pub_functions_in_workspace

      # Both gates are REQUIRED now: the workspace is clippy-clean with
      # -D warnings and rustfmt-clean, so regressions must fail CI loudly
      # instead of silently accumulating drift.
      - name: Clippy (required)
        if: runner.os == 'Linux'
        working-directory: src-rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: rustfmt (required)
        if: runner.os == 'Linux'
        working-directory: src-rust
        run: cargo fmt --all --check

      - name: Build debug binary for TUI probe
        if: runner.os == 'Linux'
        working-directory: src-rust
        run: cargo build --locked --package clawde-cli

      - name: TUI permission smoke probe
        if: runner.os == 'Linux'
        run: |
          python3 scripts/probes/tui-permissions-smoke.py \
            --binary src-rust/target/debug/clawde \
            --timeout-secs 20
